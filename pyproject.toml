[project]
name = "oreilly-edd-course"
version = "0.1.0"
description = "O'Reilly course: Eval-Driven Development for Reliable Agents"
readme = "README.md"
authors = [{ name = "benomahony", email = "ben.omahony@thoughtworks.com" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.5",
    "pydantic-ai>=2.50.0",
    "pydantic-evals>=2.50.0",
    "typer>=0.21.1",
    "pydantic-ai-harness>=0.35.0",
    "lexguard[pydantic-ai-harness,pydantic-evals]>=0.1.22",
    "pydantic-ai-slim[typesafe]>=2.50.0",
    "logfire>=5.1.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
edd = "oreilly_edd_course.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.basedpyright]
# capabilities/ is written by the improver agent at runtime, not by hand.
exclude = ["src/oreilly_edd_course/capabilities", ".venv"]
