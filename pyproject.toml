[project]
name = "oreilly-edd-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "benomahony", email = "ben.omahony@thoughtworks.com" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.5",
    "pydantic-ai>=1.56.0",
    "pydantic-evals>=1.56.0",
    "rich>=14.3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff>=0.8.0"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["oreilly_edd_course"]
